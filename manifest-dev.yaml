apiVersion: v1
kind: Service
metadata:
  name: telegram-api
  namespace: dev
  labels:
    app: telegram-api
    environment: dev
spec:
  type: ClusterIP
  selector:
    app: telegram-api
    environment: dev
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-api
  namespace: dev
  labels:
    app: telegram-api
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telegram-api
      environment: dev
  template:
    metadata:
      labels:
        app: telegram-api
        environment: dev
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: docker-hub-pull-secret
      containers:
        - name: telegram-api
          image: docker.io/anikolaevdo/telegram-api:dev
          imagePullPolicy: Always
          env:
            - name: TELEGRAM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: telegram-api-token
                  key: TELEGRAM_TOKEN
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: telegram-api-dev-env
                  key: REDIS_URL
            - name: USER_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: telegram-api-dev-env
                  key: USER_SERVICE_URL
            - name: WEB_ADMIN_INTERNAL_URL
              value: http://web-admin.dev.svc.cluster.local:8080
            - name: WEB_ADMIN_PUBLIC_URL
              value: https://admin.sparktonapp.ru
            - name: LOG_LEVEL
              value: debug
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - test -n "$TELEGRAM_TOKEN"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - test -n "$TELEGRAM_TOKEN"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 128Mi