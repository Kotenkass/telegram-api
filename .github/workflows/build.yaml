name: Build and Push Docker Image

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/telegram-api:latest

  deploy:
    runs-on:
    - self-hosted
    - Linux
    - X64
    - k8s
    - kotenkass-telegram-api

    container:
      image: bitnami/kubectl:latest
      volumes:
        - /var/run/secrets/kubernetes.io/serviceaccount:/var/run/secrets/kubernetes.io/serviceaccount
      options: --user 0
    
    needs: build
    env:
      MANIFEST_PATH: manifest.yaml
      KUBECONFIG: /tmp/kubeconfig
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      USER_SERVICE_URL: ${{ secrets.USER_SERVICE_URL }}

    steps:
      - name: Create in-cluster kubeconfig
        run: |
          SERVER="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS:-${KUBERNETES_SERVICE_PORT:-443}}"

          cat > "$KUBECONFIG" <<EOF
          apiVersion: v1
          kind: Config
          clusters:
          - name: in-cluster
            cluster:
              server: ${SERVER}
              certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          contexts:
          - name: in-cluster
            context:
              cluster: in-cluster
              user: in-cluster
              namespace: default
          current-context: in-cluster
          users:
          - name: in-cluster
            user:
              tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          EOF

          kubectl --kubeconfig "$KUBECONFIG" auth can-i get pods --all-namespaces

      - name: Create or update telegram-api environment Secret
        run: |
          kubectl --kubeconfig "$KUBECONFIG" create secret generic telegram-api-env \
            --from-literal=TELEGRAM_TOKEN="$TELEGRAM_TOKEN" \
            --from-literal=REDIS_URL="$REDIS_URL" \
            --from-literal=USER_SERVICE_URL="$USER_SERVICE_URL" \
            --dry-run=client -o yaml | kubectl --kubeconfig "$KUBECONFIG" apply -f -

      - name: Apply Manifest
        run: kubectl --kubeconfig "$KUBECONFIG" apply -f "$MANIFEST_PATH"

      - name: Set Docker image
        run: kubectl --kubeconfig "$KUBECONFIG" set image deployment/telegram-api-deployment telegram-api="${{ secrets.DOCKER_HUB_USERNAME }}/telegram-api:latest"

      - name: Restart Deployment
        run: kubectl --kubeconfig "$KUBECONFIG" rollout restart deployment telegram-api-deployment
