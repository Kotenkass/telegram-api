name: Build and Push Docker Image

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      IMAGE_NAME: ${{ secrets.DOCKER_HUB_USERNAME }}/telegram-api
      IMAGE_TAG: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
      COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
      COSIGN_PUB: ${{ vars.COSIGN_PUB }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}
      namespace: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Render Kyverno policies
        run: |
          ./scripts/render-kyverno-policies.sh rendered-k8s/policies k8s/policies

      - name: Upload rendered Kyverno policies
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rendered-kyverno-policies
          path: rendered-k8s/policies
          retention-days: 1
          if-no-files-found: error

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Run Trivy image scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache \
            aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image \
              --scanners vuln,secret \
              --severity CRITICAL \
              --exit-code 1 \
              --format table \
              "${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Push scanned Docker image
        run: docker push "${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Resolve pushed image digest
        id: digest
        run: |
          digest="$(docker buildx imagetools inspect "${IMAGE_NAME}:${IMAGE_TAG}" | awk '/Digest:/ {print $2; exit}')"
          if [ -z "$digest" ]; then
            echo "Unable to resolve pushed image digest for ${IMAGE_NAME}:${IMAGE_TAG}" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: github.event_name == 'pull_request'
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac

      - name: Sign production image with cosign
        if: github.event_name == 'pull_request'
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [ -z "$COSIGN_KEY" ] || [ -z "$COSIGN_PASSWORD" ]; then
            echo "COSIGN_KEY and COSIGN_PASSWORD secrets are required for pull requests targeting main." >&2
            exit 1
          fi
          printf '%s\n' "$COSIGN_KEY" > cosign.key
          chmod 600 cosign.key
          cosign sign --yes \
            --key cosign.key \
            "${IMAGE_NAME}@${{ steps.digest.outputs.digest }}"

      - name: Resolve immutable image reference
        id: image
        run: echo "image_ref=${IMAGE_NAME}@${{ steps.digest.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    env:
      MANIFEST_PATH: manifest.yaml
      KUBECONFIG: /tmp/kubeconfig
      NAMESPACE: ${{ needs.build.outputs.namespace }}
      IMAGE_REF: ${{ needs.build.outputs.image_ref }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      USER_SERVICE_URL: ${{ secrets.USER_SERVICE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Prepare kubeconfig
        run: |
          mkdir -p "$(dirname "$KUBECONFIG")"
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 --decode > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
          kubectl --kubeconfig "$KUBECONFIG" auth can-i get pods --all-namespaces

      - name: Download rendered Kyverno policies
        uses: actions/download-artifact@v4
        with:
          name: rendered-kyverno-policies
          path: /tmp/kyverno-policies

      - name: Ensure Kyverno policy admin RBAC
        run: kubectl --kubeconfig "$KUBECONFIG" apply -f k8s/rbac/kyverno-policy-admin.yaml

      - name: Apply Kyverno image security policies
        run: kubectl --kubeconfig "$KUBECONFIG" apply -f /tmp/kyverno-policies

      - name: Create or update telegram-api environment Secret
        run: |
          kubectl --kubeconfig "$KUBECONFIG" create secret generic telegram-api-env \
            --namespace "$NAMESPACE" \
            --from-literal=TELEGRAM_TOKEN="$TELEGRAM_TOKEN" \
            --from-literal=REDIS_URL="$REDIS_URL" \
            --from-literal=USER_SERVICE_URL="$USER_SERVICE_URL" \
            --dry-run=client -o yaml | kubectl --kubeconfig "$KUBECONFIG" apply -f -

      - name: Ensure prod namespace exists
        run: |
          kubectl --kubeconfig "$KUBECONFIG" create namespace "$NAMESPACE" --dry-run=client -o yaml | \
            kubectl --kubeconfig "$KUBECONFIG" apply -f -

      - name: Apply Manifest
        run: kubectl --kubeconfig "$KUBECONFIG" apply -n "$NAMESPACE" -f "$MANIFEST_PATH"

      - name: Set Docker image
        run: kubectl --kubeconfig "$KUBECONFIG" set image deployment/telegram-api-deployment telegram-api="$IMAGE_REF" --namespace "$NAMESPACE"

      - name: Restart Deployment
        run: kubectl --kubeconfig "$KUBECONFIG" rollout restart deployment/telegram-api-deployment --namespace "$NAMESPACE"

      - name: Wait for rollout
        run: kubectl --kubeconfig "$KUBECONFIG" rollout status deployment/telegram-api-deployment --namespace "$NAMESPACE" --timeout=180s